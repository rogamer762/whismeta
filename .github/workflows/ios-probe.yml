name: Build Whis iPhone probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-probe.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-probe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Choose an installed iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          phones = [d for runtime, group in devices['devices'].items() if 'iOS' in runtime
                    for d in group if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator found')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('WHIS_SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Run iOS unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          xcodebuild test -project ios/WhisProbe.xcodeproj -scheme WhisProbe \
            -destination "platform=iOS Simulator,id=$WHIS_SIMULATOR_ID" \
            -derivedDataPath .build/simulator -resultBundlePath .build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee .build/tests.log
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -project ios/WhisProbe.xcodeproj -scheme WhisProbe \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build/device CODE_SIGNING_ALLOWED=NO | tee .build/device.log
          mkdir -p .build/package/Payload
          cp -R .build/device/Build/Products/Release-iphoneos/WhisProbe.app .build/package/Payload/
          ditto -c -k --keepParent .build/package/Payload .build/WhisProbe-unsigned.ipa
      - name: Downloadable IPA for local signing
        uses: actions/upload-artifact@v4
        with:
          name: WhisProbe-unsigned
          path: .build/WhisProbe-unsigned.ipa
          if-no-files-found: error
      - name: Build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhisProbe-build-logs
          path: |
            .build/*.log
            .build/Tests.xcresult
          if-no-files-found: ignore
