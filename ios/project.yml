name: WhisProbe
options:
  bundleIdPrefix: dev.whis
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  WhisProbe:
    type: application
    platform: iOS
    sources: [WhisProbe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.whis.probe
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  WhisProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WhisProbeTests]
    dependencies:
      - target: WhisProbe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WhisProbe:
    build:
      targets:
        WhisProbe: all
    test:
      targets: [WhisProbeTests]
